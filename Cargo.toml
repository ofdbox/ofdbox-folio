[workspace]
resolver = "3"
members = [
    "crates/ofdbox-folio",
    "crates/ofdbox-folio-ir",
    "crates/ofdbox-folio-layout",
    "crates/ofdbox-folio-render",
    "crates/ofdbox-folio-ofd",
    "crates/ofdbox-folio-pdf",
    "crates/ofdbox-folio-docx",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["OFDBox contributors"]
repository = "https://github.com/ofdbox/ofdbox-folio"
homepage = "https://github.com/ofdbox/ofdbox-folio"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
thiserror = "2"
ofdbox-core = ">=0.0.1, <0.1"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
lopdf = { version = "0.45", features = ["wasm_js"] }
vello_cpu = "0.3.0"
skrifa = "0.44"
ttf-parser = "0.25"
png = "0.18"
jpeg-decoder = "0.3"
bmp = "0.5"
tiff = "0.9"
justbig2 = "0.2"
hayro-ccitt = "0.3"
flate2 = "1"
kurbo = "0.13"
wgpu = "30"
pollster = "1"

ofdbox-folio-ir = { path = "crates/ofdbox-folio-ir", version = "0.0.1" }
ofdbox-folio-layout = { path = "crates/ofdbox-folio-layout", version = "0.0.1" }
ofdbox-folio-render = { path = "crates/ofdbox-folio-render", version = "0.0.1" }
ofdbox-folio-ofd = { path = "crates/ofdbox-folio-ofd", version = "0.0.1" }
ofdbox-folio-pdf = { path = "crates/ofdbox-folio-pdf", version = "0.0.1" }
ofdbox-folio-docx = { path = "crates/ofdbox-folio-docx", version = "0.0.1" }

[patch.crates-io]
ofdbox-core = { path = "../ofdbox/crates/ofdbox-core" }
