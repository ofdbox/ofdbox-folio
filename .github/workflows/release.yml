name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ofdbox-folio") | .version')
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "tag ${{ github.ref_name }} does not match workspace version v$version"
            exit 1
          fi

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ofdbox-folio") | .version')
          echo "publishing workspace version $version"

          # Resumable release: a previous run may have published only part of
          # the workspace before hitting crates.io rate limits.
          already_published() {
            local crate="$1"
            curl -fsSL \
              -H "User-Agent: ofdbox-folio-release" \
              "https://crates.io/api/v1/crates/$crate" \
              | jq -e --arg v "$version" '.versions[] | select(.num == $v)' >/dev/null
          }

          publish() {
            local crate="$1"
            if already_published "$crate"; then
              echo "::notice::$crate $version is already published; skipping"
              return 0
            fi
            for attempt in $(seq 1 8); do
              if cargo publish -p "$crate" --locked; then
                return 0
              fi
              echo "publish $crate failed (attempt $attempt); retrying in 60s"
              sleep 60
            done
            echo "publish $crate failed after 8 attempts"
            return 1
          }

          publish ofdbox-folio-ir
          publish ofdbox-folio-layout
          publish ofdbox-folio-render
          publish ofdbox-folio-docx
          publish ofdbox-folio-pdf
          publish ofdbox-folio-ofd
          publish ofdbox-folio
