[package]
name = "ofdbox-folio-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Fixed IR rendering and caching for OFDBox Folio."
keywords = ["rendering", "raster", "document", "scene"]
categories = ["graphics"]

[dependencies]
ofdbox-folio-ir.workspace = true
bmp.workspace = true
jpeg-decoder.workspace = true
justbig2.workspace = true
png.workspace = true
skrifa.workspace = true
thiserror.workspace = true
tiff.workspace = true
ttf-parser.workspace = true
vello_cpu.workspace = true
tiny-skia = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
wgpu27 = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
# Backwards-compatible alias for wgpu 30.
wgpu = ["wgpu30"]
wgpu30 = ["dep:wgpu", "dep:pollster"]
wgpu27 = ["dep:wgpu27", "dep:pollster"]
tiny-skia = ["dep:tiny-skia"]

[lints]
workspace = true
