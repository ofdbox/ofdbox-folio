[package]
name = "ofdbox-folio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "OFDBox Folio multi-format document engine facade."
keywords = ["ofd", "pdf", "docx", "document", "layout"]
categories = ["text-processing", "graphics"]

[dependencies]
ofdbox-folio-ir.workspace = true
ofdbox-folio-layout = { workspace = true, optional = true }
ofdbox-folio-render = { workspace = true, optional = true }
ofdbox-folio-ofd = { workspace = true, optional = true }
ofdbox-folio-pdf = { workspace = true, optional = true }
ofdbox-folio-docx = { workspace = true, optional = true }
ofdbox-folio-markdown = { workspace = true, optional = true }
thiserror.workspace = true
zip.workspace = true

[features]
default = ["ofd", "pdf", "docx", "markdown", "layout", "cpu"]
ofd = ["dep:ofdbox-folio-ofd"]
pdf = ["dep:ofdbox-folio-pdf"]
docx = ["dep:ofdbox-folio-docx"]
markdown = ["dep:ofdbox-folio-markdown"]
layout = ["dep:ofdbox-folio-layout"]
cpu = ["dep:ofdbox-folio-render"]
gpu = ["gpu30"]
gpu30 = ["dep:ofdbox-folio-render", "ofdbox-folio-render/wgpu30"]
gpu27 = ["dep:ofdbox-folio-render", "ofdbox-folio-render/wgpu27"]
tiny-skia = ["dep:ofdbox-folio-render", "ofdbox-folio-render/tiny-skia"]

[dev-dependencies]
png.workspace = true

[[example]]
name = "render_bench"
required-features = ["tiny-skia"]

[[example]]
name = "tiny_skia_compare"
required-features = ["tiny-skia"]

[[example]]
name = "wgpu_text_bench"
required-features = ["gpu30"]

[[example]]
name = "wgpu_compare"
required-features = ["gpu30"]

[lints]
workspace = true
